[workspace]
resolver = "3"
members = ["crates/*", "titles/nxtitle", "titles/nxtitles", "titles/families/*", "titles/games/*", "xtask"]

[workspace.package]
version = "0.9.2"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
nxb-model = { path = "crates/nxb-model" }
nxtitle = { path = "titles/nxtitle" }
nxtitles = { path = "titles/nxtitles" }
nxfamily-agl = { path = "titles/families/agl" }
nxgame-oot = { path = "titles/games/0400486024DEC000" }
nxgame-botw = { path = "titles/games/01007EF00011E000" }
nxb-error = { path = "crates/nxb-error" }
nxb-sys = { path = "crates/nxb-sys" }
nxb-pyjson = { path = "crates/nxb-pyjson" }
nxb-shader = { path = "crates/nxb-shader" }
nxb-air = { path = "crates/nxb-air" }
nxb-crypto = { path = "crates/nxb-crypto" }
nxb-codec = { path = "crates/nxb-codec" }
nxb-a64 = { path = "crates/nxb-a64" }
nxb-plist = { path = "crates/nxb-plist" }
nxb-hos = { path = "crates/nxb-hos" }
nxb-romfs = { path = "crates/nxb-romfs" }
nxb-rewrite = { path = "crates/nxb-rewrite" }
nxb-split = { path = "crates/nxb-split" }
nxb-bundle = { path = "crates/nxb-bundle" }
nxb-zip = { path = "crates/nxb-zip" }
nxb-pso = { path = "crates/nxb-pso" }
nxb-obs = { path = "crates/nxb-obs" }
nxb-tool = { path = "crates/nxb-tool" }
nxb-store = { path = "crates/nxb-store" }
nxb-sched = { path = "crates/nxb-sched" }
nxb-io = { path = "crates/nxb-io" }
nxb-stages = { path = "crates/nxb-stages" }
nxb-testkit = { path = "crates/nxb-testkit" }
nxb-extract = { path = "crates/nxb-extract" }
nxb-pack = { path = "crates/nxb-pack" }
nxb-archive = { path = "crates/nxb-archive" }
nxb-build = { path = "crates/nxb-build" }
nxb-nro = { path = "crates/nxb-nro" }
nxb-profile = { path = "crates/nxb-profile" }
nxb-xlatedev = { path = "crates/nxb-xlatedev" }
nxb-xlate = { path = "crates/nxb-xlate" }
nxb-layer = { path = "crates/nxb-layer" }
nxb-maxwell = { path = "crates/nxb-maxwell" }

[profile.test]
# the parser tests recurse deeply: optimise them as the front-end project did
opt-level = 1

[profile.release]
lto = "fat"
debug = "line-tables-only"
