[package]
name = "nxb-build"
description = "nxb build: the app of a game with a title module for nxkit (extract, rewrite, link, shaders, pipeline archive, bundle) with the front ends' NDJSON events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nxb]
layer = "L3"
in_v = false

[dependencies]
nxb-model.workspace = true
nxb-sys.workspace = true
nxb-pyjson.workspace = true
nxb-sched.workspace = true
nxb-obs.workspace = true
nxb-tool.workspace = true
nxb-extract.workspace = true
nxb-pack.workspace = true
nxb-archive.workspace = true
# the shard folder names and the index file of the pipeline archive
nxkit-abi.workspace = true
nxb-stages.workspace = true
nxb-shader.workspace = true
nxb-rewrite.workspace = true
nxb-romfs.workspace = true
nxb-split.workspace = true
nxb-xlate.workspace = true
nxtitle.workspace = true
nxtitles.workspace = true

[features]
default = ["air-front"]
air-front = ["nxb-stages/air-front"]

[lints]
workspace = true
